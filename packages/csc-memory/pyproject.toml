[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "csc-memory"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "waitress>=3.0",
    "pyyaml>=6.0",
]

[project.scripts]
csc-memory-web = "csc_memory.web:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["csc_memory*"]
