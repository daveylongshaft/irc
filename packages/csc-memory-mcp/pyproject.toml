[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "csc-memory-mcp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
]

[project.scripts]
csc-memory-mcp = "csc_memory_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["csc_memory_mcp*"]
